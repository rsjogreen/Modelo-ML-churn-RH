services:
  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - file:///mlflow/artifacts
      - --allowed-hosts
      - mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "${PREFECT_PORT:-4201}:4200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  trainer:
    build: .
    profiles: ["run"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      mlflow:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

volumes:
  mlflow_data:
